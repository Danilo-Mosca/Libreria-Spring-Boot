<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments/resources :: headTags}"></div>
    <title>Categories</title>
</head>

<body>
    <nav th:replace="~{fragments/navbar :: navbar('categories')}"></nav>

    <main class="container">
        <h1>Categories</h1>
        <hr />

        <div class="col-12">
            <th:block>
                <h1 th:if="${edit}" class="py-4 mb-2 text-center">
                    Categoria "[[${category.getName()}]]"
                    <!-- Oppure grazie alle funzionalità di thymeleaf potevo scrivere anche: [[${category.name}]] -->
                </h1>
                <h1 th:unless="${edit}" class="py-4 mb-2 text-center">
                    Crea una nuova categoria
                </h1>
                <div class="row justify-content-center">
                    <div class="col-8">
                        <form id="book-form"
                            th:action="${edit} ? @{|/categories/edit/${category.id}|} : @{/categories/create}"
                            method="post" th:object="${category}">

                            <!-- Soluzione che mostra gli errori (dove presenti) nelle singole "input" -->
                            <div class="mb-3">
                                <label class="form-label" for="name">Inserisci il nome della categoria</label>
                                <input type="text" class="form-control" name="name" id="name"
                                    th:field="*{name}" th:errorClass="is-invalid" placeholder="Nome categoria">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}">
                                    <ul>
                                        <li th:each="error : ${#fields.errors('name')}" th:text="${error}" />
                                    </ul>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label" for="description">Descrizione:</label>
                                <textarea name="description" class="form-control" id="description" th:field="*{description}"
                                    th:errorClass="is-invalid" placeholder="Descrizione categoria (opzionale)"></textarea>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}">
                                    <ul>
                                        <li th:each="error : ${#fields.errors('description')}" th:text="${error}">
                                        </li>
                                    </ul>
                                </div>
                            </div>

                            <div class="mb-3 d-flex justify-content-between">
                                <input type="submit" class="btn btn-primary" value="Salva">
                                <!-- Sostituisco il pulsante type="reset" con un tag <a> che linka al metodo create() in modalità GET nel controller BookController.java: @GetMapping("/create") -->

                                <!-- Reset del form per azzerare i campi. Spiegazione:
                                1. form.reset() ripristina i valori iniziali del form
                                2. Poi sovrascriviamo i singoli campi impostando value = '' per svuotarli completamente (date e textarea)
                                3. type="button" evita che il bottone invii (come con submit) il form 
                                Funziona sia in modalità create (campi già vuoti) che in modalità edit (campi popolati con dati del borrowing )-->
                                <button type="button" class="btn btn-warning" onclick="document.getElementById('book-form').reset(); 
                                    document.getElementById('name').value=''; 
                                    document.getElementById('description').value='';">
                                    Azzera i campi
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </th:block>
        </div>

    </main>

    <div th:replace="~{fragments/resources :: scripts}"></div>
</body>

</html>
