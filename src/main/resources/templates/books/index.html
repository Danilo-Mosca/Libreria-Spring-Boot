<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments/resources :: headTags}"></div>
    <title>Books</title>
</head>

<body>
    <nav th:replace="~{fragments/navbar :: navbar('books')}"></nav>

    <div class="container">
        <h1>Books</h1>
        <hr />  
        <div class="mb-3 d-flex">
            <a th:href="@{/books/create}" class="me-auto btn btn-primary btm-sm">
                Crea un nuovo libro
            </a>
        </div>

        <section class="row">
            <div class="col-12">
                <table class="table" th:if="${books.size() > 0}">
                    <thead>
                        <tr>
                            <th>Id</th>
                            <th>Titolo</th>
                            <th>Autore</th>
                            <th>Anno di pubblicazione</th>
                            <th>Numero di pagine</th>
                            <th>Genere</th>
                            <th>Disponibilità</th>
                            <th>Descrizione</th>
                            <th>Azioni</th>
                            <th></th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="book : ${books}" th:object="${book}">
                            <td>[[*{id}]]</td>
                            <td>[[*{title}]]</td>
                            <td>[[*{author}]]</td>
                            <td>[[*{yearOfPublication}]]</td>
                            <td th:text="*{pages}"></td>
                            <td th:text="*{genre}"></td>
                            <td th:text="*{available}"></td>
                            <td th:text="*{description}"></td>
                            <td><a th:href="@{/books/{id} (id = *{id})}" class="btn btn-primary btn-sm">Mostra</a></td>
                            <td><a th:href="@{/books/edit/{id}(id = *{id})}" class="btn btn-success btn-sm">Modifica</a></td>
                            <td>
                                <form th:action="@{/books/delete/{id} (id=${book.id})}" method="post">
                                    <!-- Descrizione delle classi in CSS aggiunte:
                                    - d-inline-flex — il bottone resta inline-block ma diventa flex orizzontale
                                    - align-items-center — centra icona e testo verticalmente
                                    - gap-1 — piccola spaziatura tra icona e testo (rimuove lo spazio da newline) -->
                                    <button type="submit" class="btn btn-danger btn-sm d-inline-flex align-items-center gap-1">
                                        <i class="far fa-trash-alt"></i><span>Elimina</span>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <p th:text="Non ci sono libri in biblioteca in questo momento..." th:unless="${books.size() > 0}"></p>
            </div>

        </section>
        
    </div>

    <div th:replace="~{fragments/resources :: scripts}"></div>
</body>

</html>
